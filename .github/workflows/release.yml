name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - run: yarn install --frozen-lockfile

      - name: Test all packages
        run: npx turbo run test

      - name: Build all packages
        run: npx turbo run build

      - name: Detect changes and bump versions
        id: bump
        run: |
          result=$(node scripts/release.mjs)
          echo "packages=$result" >> $GITHUB_OUTPUT

      - name: Commit version bumps
        if: steps.bump.outputs.packages != '[]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: bump package versions [skip ci]" || true
          git pull --rebase
          git push

      - name: Publish @appss/sdk-core
        if: contains(steps.bump.outputs.packages, '@appss/sdk-core')
        working-directory: packages/core
        run: npm publish --access public --provenance --registry https://registry.npmjs.org

      - name: Publish @appss/sdk-browser
        if: contains(steps.bump.outputs.packages, '@appss/sdk-browser')
        working-directory: packages/browser
        run: npm publish --access public --provenance --registry https://registry.npmjs.org

      - name: Publish @appss/sdk-node
        if: contains(steps.bump.outputs.packages, '@appss/sdk-node')
        working-directory: packages/node
        run: npm publish --access public --provenance --registry https://registry.npmjs.org

      # After publishing, never before it. The tag is named after the highest version in the
      # release, because a release does not have to touch core: a browser-only bump left the
      # tag at core's unchanged version, `git tag` refused a name that already existed, and
      # the job died on that line — with the version bump already committed and pushed, and
      # nothing published. The existence check keeps a repeat from failing the run again.
      - name: Create release tag
        if: steps.bump.outputs.packages != '[]'
        run: |
          TAG="v$(node -p "
            const versions = ['core', 'browser', 'node']
              .map((p) => require('./packages/' + p + '/package.json').version);
            versions.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            versions[versions.length - 1]")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — nothing to tag"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
